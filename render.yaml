services:
  - type: web
    name: roma-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Pinned to match what was tested locally - pydantic-core has no
      # prebuilt wheel yet for newer Python versions (e.g. 3.14), which
      # otherwise forces a from-source build that fails on Render.
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: GOOGLE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Comma-separated - main.py splits on "," (see FastAPI CORSMiddleware
      # setup). Includes localhost too so local dev keeps working.
      - key: FRONTEND_ORIGIN
        value: https://ai-marketing-strategist.vercel.app,http://localhost:5173
